[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebdi"
version = "0.2.0"
description = "Reproducible road-safety metrics, exposure audits and index experiments"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Javier Saguar"}]
dependencies = [
  "pandas>=2.2,<3", "pyarrow>=18", "duckdb>=1.2", "requests>=2.32",
  "pyyaml>=6", "openpyxl>=3.1", "python-calamine>=0.3",
  "numpy>=2", "scipy>=1.14", "scikit-learn==1.8.0", "plotly>=6",
  "streamlit>=1.44", "matplotlib>=3.9", "joblib>=1.4", "pdfplumber>=0.11,<0.12",
]

[project.optional-dependencies]
explain = ["shap==0.52.0", "numba>=0.61,<0.65"]

[project.scripts]
ebdi = "ebdi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "pandas-stubs", "types-PyYAML", "types-requests", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/ebdi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/ebdi"]
ignore_missing_imports = true
check_untyped_defs = true
