name: Research checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src dashboard tests scripts
      - run: uv run ruff format --check src dashboard tests scripts
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/build_notebooks.py
