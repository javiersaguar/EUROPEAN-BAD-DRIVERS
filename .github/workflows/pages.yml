name: Publish observatory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run lint && npm run format:check && npm test && npm run build
        working-directory: web
        env:
          PAGES_BASE: /EUROPEAN-BAD-DRIVERS/
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: PAGES_BASE=/EUROPEAN-BAD-DRIVERS/ npm run test:e2e
        working-directory: web
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: publish
