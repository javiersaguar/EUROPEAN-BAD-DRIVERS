name: Observatory checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - run: uv export --locked --no-dev --extra explain --no-emit-project --format requirements-txt > /tmp/requirements.txt
      - run: uvx pip-audit==2.10.1 -r /tmp/requirements.txt --no-deps --disable-pip
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run lint && npm run format:check && npm test && npm run build
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build --tag observatory:test .
      - run: |
          docker run --detach --name observatory --read-only --tmpfs /tmp --tmpfs /var/cache/nginx --publish 8080:8080 observatory:test
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8080/health.json && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/data/observatory.json > /tmp/observatory.json
          python -c "import json; d=json.load(open('/tmp/observatory.json')); assert d['schema_version']==1 and len(d['tables']['spain_metrics'])==156"
          test "$(docker inspect --format '{{.Config.User}}' observatory)" = 101
          curl --fail --silent --head http://127.0.0.1:8080/health.json | grep -qi 'X-Content-Type-Options: nosniff'
      - run: docker logs observatory
        if: failure()
